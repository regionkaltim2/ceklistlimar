<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pengiriman TBS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        /* Container untuk memotong (crop) top banner 40px bawaan Google Apps Script */
        .app-crop-wrapper {
            position: absolute;
            top: -40px; /* Menggeser iframe ke atas 40px untuk menyembunyikan banner */
            left: 0;
            width: 100%;
            height: calc(100% + 40px); /* Menambah tinggi agar tidak ada sela di bawah */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading Spinner saat memuat aplikasi */
        .loading-screen {
            position: absolute;
            inset: 0;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-screen">
        <div class="spinner"></div>
        <p style="font-weight: 600; font-size: 14px; letter-spacing: 0.5px;">Memuat Aplikasi Pengiriman TBS...</p>
    </div>

    <div class="app-crop-wrapper">
        <!-- GANTI URL SRC DI BAWAH INI DENGAN URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA -->
        <iframe 
            id="gasFrame"
            src="https://script.google.com/macros/s/AKfycbxWp12BY5RvYFSBwpoMq3fmAqL6KWaslPdPsUlaKQlT8cxuaNIKl4C3Dc8vD0R2AAPc/exec" 
            allow="geolocation; microphone; camera"
            onload="hideLoading()">
        </iframe>
    </div>

    <script>
        function hideLoading() {
            const loader = document.getElementById('loading');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }
        }
    </script>
</body>
</html>
